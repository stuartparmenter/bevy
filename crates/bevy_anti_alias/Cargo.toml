[package]
name = "bevy_anti_alias"
version = "0.20.0-dev"
edition = "2024"
description = "Provides various anti-aliasing implementations for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
trace = []
webgl = []
webgpu = []
smaa_luts = ["bevy_image/ktx2", "bevy_image/zstd"]
dlss = [
  "dep:dlss_wgpu",
  "dep:uuid",
  "dep:bevy_log",
  "dep:bevy_window",
  "bevy_render/raw_vulkan_init",
  "bevy_render/paced_present",
]
force_disable_dlss = ["dlss_wgpu?/mock"]

[dependencies]
# bevy
bevy_asset = { path = "../bevy_asset", version = "0.20.0-dev" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev" }
bevy_camera = { path = "../bevy_camera", version = "0.20.0-dev" }
bevy_math = { path = "../bevy_math", version = "0.20.0-dev" }
bevy_utils = { path = "../bevy_utils", version = "0.20.0-dev" }
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_image = { path = "../bevy_image", version = "0.20.0-dev" }
bevy_derive = { path = "../bevy_derive", version = "0.20.0-dev" }
bevy_shader = { path = "../bevy_shader", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.20.0-dev" }
bevy_diagnostic = { path = "../bevy_diagnostic", version = "0.20.0-dev" }
bevy_log = { path = "../bevy_log", version = "0.20.0-dev", optional = true }
bevy_window = { path = "../bevy_window", version = "0.20.0-dev", optional = true }

# other
tracing = { version = "0.1", default-features = false, features = ["std"] }
dlss_wgpu = { git = "https://github.com/stuartparmenter/dlss_wgpu", branch = "frame-generation", optional = true }
uuid = { version = "1.21.0", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
features = ["bevy_image/zstd_rust"]
