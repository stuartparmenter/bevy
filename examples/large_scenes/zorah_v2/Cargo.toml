[package]
name = "zorah_v2"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
argh = "0.1.12"
bevy = { path = "../../..", default-features = false, features = [
  # LinearSpline for the camera path.
  "bevy_curve",
  "bevy_gltf",
  # The export's every geometry buffer view is EXT_meshopt_compression.
  "gltf_meshopt",
  "bevy_solari",
  "meshlet",
  # The bake builds meshlet meshes at runtime, in the app's own process.
  "meshlet_processor",
  "bevy_camera_controller",
  "free_camera",
  "default_app",
  # The frame-rate overlay (--no-hud disables it).
  "bevy_ui_render",
  "default_font",
  "multi_threaded",
  "ktx2",
  "zstd_rust",
  "png",
  # The sidecar environment map is an equirectangular .hdr.
  "hdr",
  "std",
  "3d_bevy_render",
] }
# Reads the root glTF and the per-mesh wrappers directly: the asset server's
# glTF loader would pull every 4k texture in as a dependency.
gltf = { version = "1.4", default-features = false, features = [
  "extensions",
  "names",
  "utils",
  "KHR_materials_transmission",
  "KHR_materials_ior",
  "KHR_materials_unlit",
  "KHR_materials_specular",
  "KHR_texture_transform",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Sizes the default bake worker count from the machine's total memory.
sysinfo = "0.39"
futures-io = "0.3"
# The bake's threads allocate constantly inside meshopt and metis, and the
# system heap serialises them.
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
# DLSS Ray Reconstruction denoises the Solari path. On by default (needs an
# NVIDIA RTX GPU and the DLSS SDK to build); build with
# `--no-default-features --features mimalloc` to run Solari without DLSS.
default = ["dlss", "mimalloc"]
dlss = ["bevy/dlss"]
mimalloc = ["dep:mimalloc"]

[target.'cfg(windows)'.dependencies]
bevy = { path = "../../..", default-features = false, features = ["bevy_winit"] }

[[bin]]
name = "zorah_v2"
path = "src/main.rs"

[lints]
workspace = true
