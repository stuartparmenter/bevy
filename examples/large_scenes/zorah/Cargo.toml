[package]
name = "zorah"
version = "0.1.0"
edition = "2024"
default-run = "zorah"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
argh = "0.1.12"
bevy = { path = "../../..", default-features = false, features = [
  "asset_processor",
  "bevy_camera_controller",
  # LinearSpline for the camera path.
  "bevy_curve",
  "bevy_solari",
  # The frame-rate overlay (--no-hud disables it).
  "bevy_ui_render",
  "default_app",
  "default_font",
  "free_camera",
  "meshlet",
  # The candle flames build their shared 168-triangle lathe at startup rather
  # than loading it from the packed bundles, so a stale assets tree cannot leave
  # ThroneRoom without its flames. It costs the runtime build metis and meshopt.
  "meshlet_processor",
  "multi_threaded",
  "ktx2",
  # Zorah's DecalActors spawn as clustered decals, which compile out without it.
  "pbr_clustered_decals",
  "png",
  "std",
  "zstd_rust",
  "3d_bevy_render",
] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-io = "0.3"
lz4_flex = { version = "0.13", default-features = false, features = ["frame"], optional = true }

[features]
default = ["dlss"]
dlss = ["bevy/dlss"]
packer = ["bevy/compressed_image_saver", "dep:lz4_flex"]

[target.'cfg(windows)'.dependencies]
bevy = { path = "../../..", default-features = false, features = ["bevy_winit"] }

[[bin]]
name = "zorah"
path = "src/main.rs"

[[bin]]
name = "zorah_pack"
path = "src/bin/zorah_pack.rs"
required-features = ["packer"]

[[bin]]
name = "zorah_capacity"
path = "src/bin/zorah_capacity.rs"
required-features = ["packer"]
